<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Christmas Crane Game</title>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            console.error(msg, error);
            const status = document.getElementById('status');
            if(status) status.innerHTML = "<span style='color:red'>Error: " + msg + "</span>";
            return false;
        };
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "cannon-es": "https://esm.sh/cannon-es@0.20.0",
                "nipplejs": "https://esm.sh/nipplejs@0.10.1"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="header">
            <h1>🎅 Santa's Claw</h1>
            <div id="status">Loading...</div>
        </div>

        <div id="cooldown-timer" class="hidden">
            Next Free Play: <span id="timer-val">00:00:00</span>
        </div>

        <div id="controls-hint">WASD to Move • SPACE to Drop</div>

        <div id="inventory-btn">🎁 Inventory</div>

        <button id="play-btn" disabled>CHECKING...</button>
        
        <!-- Mobile Joystick Container -->
        <div id="joystick-zone"></div>
        <button id="mobile-drop-btn">DROP CLAW</button>
    </div>

    <div id="inventory-modal" class="hidden">
        <div class="modal-content">
            <h2>Your Prizes</h2>
            <div id="inventory-list"></div>
            <button id="close-inventory">Close</button>
        </div>
    </div>

    <div id="win-modal" class="hidden">
        <div class="modal-content">
            <h2>🎉 YOU WON! 🎉</h2>
            <p id="win-item-name">A Gift!</p>
            <button id="claim-prize">Awesome!</button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
